<main class="login-layout">
  <section class="login-visual">
    <p class="login-kicker">Conecta Tech Eventos</p>
    <h1>Boas-vindas de volta.</h1>
    <p>Entre para acompanhar sua programação, eventos e perfil em um só lugar.</p>
    <img src="assets/img/Login.png" alt="Ilustração de acesso">
  </section>

  <section class="login-form-panel">
    <form #loginForm="ngForm" class="form-signin" (ngSubmit)="login()">
      <span class="login-icon"><i class="fa fa-users" aria-hidden="true"></i></span>
      <p class="login-eyebrow">Acesso à conta</p>
      <h2>Entrar</h2>

    <label for="username" class="sr-only">Usuário</label>
    <input
      [(ngModel)]="model.userName"
      name="username"
      type="text"
      id="username"
      class="form-control"
      placeholder="Usuário"
      required
    >

    <label for="password" class="sr-only">Password</label>
    <input
      [(ngModel)]="model.password"
      name="password"
      type="password"
      id="password"
      class="form-control"
      placeholder="Senha"
required
>



<button
  class="btn btn-lg btn-login btn-block"
  type="submit">
  Entrar
</button>

<p class="mt-4 mb-2 text-muted">Não tem login? Cadastre-se abaixo</p>

<a
  class="btn btn-lg btn-link btn-block"
  routerLink="/user/registration">
  Quero me cadastrar
</a>

    </form>
  </section>
</main>
