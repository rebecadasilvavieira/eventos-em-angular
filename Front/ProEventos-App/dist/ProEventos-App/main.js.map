<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm" *ngIf="showMenu()">
  <div class="container">
    <a class="navbar-brand" routerLink="home" aria-label="Conecta Tech Eventos" title="Conecta Tech Eventos">
      <span class="nav-brand-icon">
        <i class="fa fa-users" aria-hidden="true"></i>
      </span>
    </a>
    <button class="navbar-toggler" (click)="isCollapsed = !isCollapsed" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
 <div
  class="collapse navbar-collapse"
  [collapse]="isCollapsed"
  [isAnimated]="true"
  id="navbarNav"
>
  <ul class="navbar-nav mr-auto">

    <ng-container *ngIf="(accountService.currentUser$ | async) !== null">

      <li class="nav-item" routerLinkActive="active">
        <a
          class="nav-link"
          aria-current="page"
          routerLink="dashboard">
          Dashboard
        </a>
      </li>


      <li class="nav-item" routerLinkActive="active">
        <a
          class="nav-link"
          aria-current="page"
          routerLink="eventos/lista">
          Eventos
        </a>
      </li>

      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link" routerLink="palestrantes">
          Palestrantes
        </a>
      </li>

      <li class="nav-item" routerLinkActive="active">
        <a class="nav-link" routerLink="contatos">
          Contatos
        </a>
      </li>

    </ng-container>

  </ul>



   <div
  *ngIf="(accountService.currentUser$ | async) === null && !isHome() && !isRegistration()"
  class="navbar-nav mr-3 d-xs-none d-none d-md-flex"
>
  <a class="btn btn-light mr-2 border" routerLink="/user/login">Entrar</a>
  <a class="btn btn-warning" routerLink="/user/registration">Me Cadastrar</a>
</div>

<ul
  *ngIf="(accountService.currentUser$ | async) !== null"
  class="navbar-nav"
>
  <li class="nav-item dropdown" dropdown *ngIf="(accountService.currentUser$ | async) as user">
    <a
      dropdownToggle
      class="nav-link dropdown-toggle"
      style="cursor: pointer;"
      id="navbarDropdownMenuLink"
      aria-haspopup="true"
      aria-expanded="false"
    >
      {{ user.userName | titlecase}}
    </a>
          <div *dropdownMenu class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdownMenuLink">
            <a class="dropdown-item" routerLink="/user/perfil">
              Perfil
            </a>
           <div role="separator" class="divider"></div>

          <a (click)="logout()" class="dropdown-item" style="cursor: pointer;">
            Sair
          </a>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>
