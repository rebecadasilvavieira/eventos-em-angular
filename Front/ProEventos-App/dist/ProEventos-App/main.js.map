<header class="page-heading">
  <div class="page-heading__identity">
    <span class="page-heading__icon">
      <i class="{{iconClass}}" aria-hidden="true"></i>
    </span>
    <div>
      <p class="page-heading__eyebrow">Conecta Tech Eventos</p>
      <h2>{{titulo}}</h2>
      <small>{{subtitulo}}</small>
    </div>
  </div>
  <button class="page-heading__action" *ngIf="botaoListar" (click)="listar()">
    <i class="fas fa-list-ul" aria-hidden="true"></i>
    <span>Listar {{titulo}}</span>
  </button>
</header>
